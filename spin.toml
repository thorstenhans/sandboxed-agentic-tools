#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "sandboxed-agentic-tools"
version = "0.1.0"
authors = ["Thorsten Hans <thorsten.hans@gmail.com>"]
description = ""

[[trigger.http]]
route = "/..."
component = "sandboxed-agentic-tools"

[component.sandboxed-agentic-tools]
source = "target/wasm32-wasip2/release/sandboxed_agentic_tools.wasm"
allowed_outbound_hosts = []

[component.sandboxed-agentic-tools.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
